[workspace]
members = ["photo-core", "app"]
exclude = ["vendor/craft-ui"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "tiff", "bmp", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
